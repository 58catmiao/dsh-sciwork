    # ── 科研库面板 ────────────────────────────────────────────────────────────
    # 面板代码在 lib/（library.js / actions.js / replot.js / index.js / client.js）。
    # 下面两行是**生效行**，缩进必须和上面的 `- id: preset-research` 一模一样（4/6）——
    # 差一格就是 `YAMLException: bad indentation of a sequence entry`，整个 bundle 会被跳过。
    #
    # 端点用「精确 Fetch 路由」而不是 rpc.intercept，原因：
    #   `/api` 通道**只允许一个拦截器**，已经被 `@deepseek-ai/dsh-api-gateway` 占用。
    #   抢注拦截器会让官方端点（settings/describe、credentials/describe、agentPresets/list …）
    #   全部落进 404 分支，桌面欢迎流程直接失败（原生恢复对话框）。
    #   改成 `ctx.connection.fetch.register({ path: '/api/research/call', methods: ['POST'],
    #   requestBody: 'buffered', fetch })` 之后：精确路由在 `createSharedFetchHandler` 里
    #   优先于拦截器，与 api-gateway 完全共存；未注册端点仍返回 404，路径逃逸被拒。
    - id: research-library
      name: 'dsh-sciwork'

